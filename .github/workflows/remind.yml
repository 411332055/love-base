name: 每天 00:00 提醒
on:
  schedule:
    # 每天台灣時間 00:00（UTC 16:00）：今天的紀念日、約好的願望、時光膠囊、輪到誰抽題
    # GitHub 的排程常會晚到、整點最擠時甚至整個跳過（2026-11-29 00:00 那次就沒跑），
    # 所以排好幾次、避開整點：哪一次先跑就由它發，之後的看到「已經發過了」就跳過，不會重複推播。
    # 程式用跑的當下的台灣日期算，所以全部都要排在台灣 00:00 之後（UTC 16:00 之後）。
    - cron: "3 16 * * *"
    - cron: "17 16 * * *"
    - cron: "36 16 * * *"
    - cron: "58 16 * * *"
  workflow_dispatch:
permissions:
  contents: read
  # 讓下面「保持開啟」那一步可以重新啟用這個排程
  actions: write
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock web-push@4.0.0
      - run: node tools/remind.mjs
        env:
          ROOM_CODE: ${{ secrets.ROOM_CODE }}
      # GitHub 會把 60 天沒有更新程式的排程自動暫停；每次跑完都重新啟用一次，計時就會重算。
      # 這一步失敗也不影響上面的提醒。
      - name: 保持排程開啟
        if: always()
        continue-on-error: true
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/remind.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
