name: 紀念日前一天提醒
on:
  schedule:
    # 每天台灣時間晚上 8:23（UTC 12:23）檢查明天是不是紀念日、生日或七夕
    - cron: "23 12 * * *"
  workflow_dispatch:
permissions:
  contents: read
  # 讓下面「保持開啟」那一步可以重新啟用這個排程
  actions: write
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock web-push@4.0.0
      - run: node tools/remind.mjs
        env:
          ROOM_CODE: ${{ secrets.ROOM_CODE }}
      # GitHub 會把 60 天沒有更新程式的排程自動暫停；每次跑完都重新啟用一次，計時就會重算。
      # 這一步失敗也不影響上面的提醒。
      - name: 保持排程開啟
        if: always()
        continue-on-error: true
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/remind.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
